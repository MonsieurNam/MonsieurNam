name: Sync Google Scholar

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-scholar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Sync README from Google Scholar
        run: python GoogleScholar_Scape_to_Readme_file.py

      - name: Run tests
        run: pytest

      - name: Commit and push changes
        run: |
          if git diff --quiet -- README.md; then
            echo "No Scholar updates found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync Google Scholar publications"
          git push
